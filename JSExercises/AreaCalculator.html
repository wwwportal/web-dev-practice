  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
  <script>
    var incomplete = true;
    do {
        var shape = prompt("Please enter the shape you want to calculate the area \n" 
        + "(1: Triangle, 2:Rectangle, 3:Circle)");
        switch (shape) {
          case '1':
            incomplete = false;
            window.location.href = 'TriangularArea.html';
            break;
          case '2':
            incomplete = false;
            window.location.href = 'RectangularArea.html';
            break;
          case '3':
            incomplete = false;
            window.location.href = 'CircularArea.html';
            break;
          default:
            window.alert("Invalid input!");
            break;
        }
    } while (incomplete);
  </script>
</head>
