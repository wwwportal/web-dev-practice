<div class="container-fluid" ng-app="triangleCalculator" ng-controller="ctrl">
    <div class="row">
        <div class="col-md-9">
        <h2>This program calculates the area of a triangle</h2>
        <h4>Please enter the height and base of the triangle</h4>
        Height: <input name="height" type="number" ng-model="height" ng-change="updateArea()"><br>
        Base: <input name="base" type="number" ng-model="base" ng-change="updateArea()"><br>
        <br>
        <h5>Area of the triangle: {{area}}</h5>
        </div>
    </div>
</div>

<script>
var app = angular.module('triangleCalculator', []);
app.controller('ctrl', function($scope, $window) {
    $scope.height = 0;
    $scope.base = 0;
    $scope.area = 0;
    $scope.updateArea = function() {
        $scope.area = ($scope.height * $scope.base) / 2;
    };

});
</script>
